<div class="project-detail">
    <h2>{{ project?.title }}</h2>
    <p><strong>Descripción:</strong> {{ project?.description }}</p>
    <p><strong>Fecha de inicio:</strong> {{ project?.start_date | date }}</p>
    <p><strong>Fecha de fin:</strong> {{ project?.end_date | date }}</p>
    <p><strong>Estado:</strong> {{ project?.status }}</p>
  </div>
